[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buried-resources"
version = "0.1.0"
description = "Country-level resource recovery benchmarking with World Bank What a Waste 3.0 and WDI"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
buried-resources = "buried_resources.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
